# 服务器配置

# 监听端口
port = 8888

# 线程池大小
thread_pool_size = 8

# 连接超时时间（秒）
connection_timeout = 300

# 心跳检测间隔（秒）
heartbeat_interval = 60

# 最大消息历史记录数
max_message_history = 1000

# 日志文件
log_file = chat_server.log

# 是否在控制台输出日志
console_log = true

# 数据库配置
database_path = chat_server.db

# Web管理界面配置
web_port = 8080
enable_web_interface = true